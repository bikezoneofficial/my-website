<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bike Zone Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#090909;
      color:#fff;
      font-family:Arial,sans-serif
    }
    .wrap{
      max-width:850px;
      margin:auto;
      padding:25px 18px 60px
    }
    .panel{
      background:#151515;
      border:1px solid #292929;
      border-radius:18px;
      padding:22px;
      margin-bottom:20px
    }
    h1{margin-top:0}
    input{
      width:100%;
      padding:13px;
      margin:7px 0;
      background:#0d0d0d;
      color:#fff;
      border:1px solid #383838;
      border-radius:10px;
      font-size:16px
    }
    button{
      padding:12px 17px;
      margin:6px 5px 6px 0;
      border:0;
      border-radius:10px;
      background:#ff6b00;
      color:#fff;
      font-weight:bold;
      font-size:15px
    }
    button.secondary{background:#444}
    button.danger{background:#b82020}
    button.edit{background:#555}
    button:disabled{opacity:.6}
    .hidden{display:none}
    .muted{color:#999}
    .status{
      padding:12px;
      background:#202020;
      border-radius:10px;
      margin-top:12px
    }
    .bike{
      background:#101010;
      border:1px solid #292929;
      border-radius:14px;
      padding:15px;
      margin-top:14px
    }
    .bike img{
      width:100%;
      max-height:250px;
      object-fit:cover;
      border-radius:10px
    }
    .price{
      font-size:22px;
      font-weight:bold;
      color:#ff913d;
      margin:8px 0
    }
    .tag{
      display:inline-block;
      background:#292929;
      padding:7px 9px;
      border-radius:8px;
      margin:3px
    }
    #preview{
      width:100%;
      max-height:250px;
      object-fit:cover;
      border-radius:10px;
      margin-top:10px
    }
  
.gallery{position:relative;width:100%;margin-bottom:10px}
.gallery-img{width:100%;height:250px;object-fit:cover;border-radius:10px;display:block}
.gallery-prev,.gallery-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:0;margin:0;border-radius:50%;background:rgba(0,0,0,.78);color:#fff;font-size:30px;line-height:40px;z-index:2}
.gallery-prev{left:10px}.gallery-next{right:10px}
.gallery-count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.78);padding:5px 9px;border-radius:8px;font-size:13px}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <div class="panel" id="loginPanel">
    <h1>🔐 Bike Zone Admin</h1>

    <p class="muted">Admin login</p>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <div id="loginMessage" class="status"></div>
  </div>


  <!-- ADMIN -->
  <div class="panel hidden" id="adminPanel">

    <h1>🚲 Bike Zone Admin</h1>

    <p>Welcome, Admin!</p>

    <button id="addBtn">➕ Add Bike</button>
    <button id="refreshBtn" class="secondary">🔄 Refresh</button>
    <button id="logoutBtn" class="secondary">🚪 Logout</button>

    <div id="status" class="status">
      Admin panel ready.
    </div>

  </div>


  <!-- ADD / EDIT -->
  <div class="panel hidden" id="formPanel">

    <h2 id="formTitle">➕ Add Bike</h2>

    <input id="name" placeholder="Bike Name">
    <input id="model" placeholder="Model">
    <input id="price" type="number" placeholder="Price">
    <input id="year" type="number" placeholder="Year">
    <input id="km" type="number" placeholder="KM Driven">

    <p class="muted">Bike Photo</p>

    <input id="photo" type="file" accept="image/*">

    <img id="preview" class="hidden">

    <button id="saveBtn">💾 Save Bike</button>
    <button id="cancelBtn" class="secondary">Cancel</button>

  </div>


  <!-- BIKES -->
  <div class="panel hidden" id="listPanel">

    <h2>🏍️ Available Bikes</h2>

    <div id="bikeList">
      Loading...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://jwvuyvqejoweyyhexonh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9xr4-mJuetYNknBqMVvcYA_7OzE6CDm";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let currentImageUrl = "";


// ELEMENTS
const loginPanel =
document.getElementById("loginPanel");

const adminPanel =
document.getElementById("adminPanel");

const formPanel =
document.getElementById("formPanel");

const listPanel =
document.getElementById("listPanel");

const loginMessage =
document.getElementById("loginMessage");

const statusBox =
document.getElementById("status");


// LOGIN
document.getElementById("loginBtn")
.addEventListener("click", async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  if(!email || !password){

    loginMessage.textContent =
    "Email aur password bharo.";

    return;
  }

  loginMessage.textContent =
  "Login ho raha hai...";

  const {error} =
  await db.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    loginMessage.textContent =
    "Login failed: " + error.message;

    return;
  }

  loginMessage.textContent =
  "Login successful! Checking admin access...";

  await checkAdmin();

});


// CHECK ADMIN ACCESS
async function checkAdmin(){

  const {data:{user}} =
    await db.auth.getUser();

  if(!user){
    loginPanel.classList.remove("hidden");
    adminPanel.classList.add("hidden");
    formPanel.classList.add("hidden");
    listPanel.classList.add("hidden");
    return false;
  }

  const {data,error} =
    await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

  if(error || !data){

    await db.auth.signOut();

    loginPanel.classList.remove("hidden");
    adminPanel.classList.add("hidden");
    formPanel.classList.add("hidden");
    listPanel.classList.add("hidden");

    loginMessage.textContent =
      "Access denied. Ye account admin nahi hai.";

    return false;
  }

  showAdmin();
  return true;
}


// SHOW ADMIN

function showAdmin(){

  loginPanel.classList.add("hidden");

  adminPanel.classList.remove("hidden");

  listPanel.classList.remove("hidden");

  loadBikes();

}


// LOGOUT
document.getElementById("logoutBtn")
.addEventListener("click", async function(){

  await db.auth.signOut();

  location.reload();

});


// ADD BUTTON
document.getElementById("addBtn")
.addEventListener("click", function(){

  editingId = null;

  currentImageUrl = "";

  clearForm();

  document.getElementById("formTitle").textContent =
  "➕ Add Bike";

  formPanel.classList.remove("hidden");

  window.scrollTo({
    top:formPanel.offsetTop,
    behavior:"smooth"
  });

});


// CANCEL
document.getElementById("cancelBtn")
.addEventListener("click", function(){

  formPanel.classList.add("hidden");

  clearForm();

});


// PHOTO PREVIEW
document.getElementById("photo1")
.addEventListener("change", function(){

  const file = this.files[0];

  const preview =
  document.getElementById("photoPreviews");

  if(!file){

    return;
  }

  preview.src =
  URL.createObjectURL(file);

  preview.classList.remove("hidden");

});


// UPLOAD PHOTO
async function uploadPhoto(file){

  if(!file){
    return currentImageUrl || null;
  }

  const extension =
  file.name.split(".").pop().toLowerCase();

  const fileName =
  "bike-" +
  Date.now() +
  "-" +
  Math.random().toString(36).substring(2) +
  "." +
  extension;

  const filePath =
  fileName;

  const {error} =
  await db.storage
    .from("bike-images")
    .upload(filePath, file, {
      cacheControl:"3600",
      upsert:false
    });

  if(error){
    throw error;
  }

  const {data} =
  db.storage
    .from("bike-images")
    .getPublicUrl(filePath);

  return data.publicUrl;
}


// SAVE
document.getElementById("saveBtn")
.addEventListener("click", async function(){

  const name =
  document.getElementById("name").value.trim();

  const model =
  document.getElementById("model").value.trim();

  const price =
  document.getElementById("price").value;

  const year =
  document.getElementById("year").value;

  const km =
  document.getElementById("km").value;

  const photo =
  document.getElementById("photo1").files[0];


  if(!name){

    alert("Bike Name bharo.");

    return;
  }


  const saveBtn =
  document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.textContent =
  "Saving...";


  try{

    // PHOTO UPLOAD
    if(photo){

      statusBox.textContent =
      "📸 Photo upload ho rahi hai...";

      currentImageUrl =
      await uploadPhoto(photo);
    }


    // DATA
    const bikeData = {

      name:name,

      model:model || null,

      price:price
        ? Number(price)
        : null,

      year:year
        ? Number(year)
        : null,

      km:km
        ? Number(km)
        : null,

      image_url:
        currentImageUrl || null

    };


    // EDIT
    if(editingId){

      const {error} =
      await db
        .from("bikes")
        .update(bikeData)
        .eq("id", editingId);

      if(error) throw error;

      statusBox.textContent =
      "✅ Bike updated successfully.";

    }


    // ADD
    else{

      const {error} =
      await db
        .from("bikes")
        .insert([bikeData]);

      if(error) throw error;

      statusBox.textContent =
      "✅ Bike added successfully.";

    }


    clearForm();

    formPanel.classList.add("hidden");

    editingId = null;

    currentImageUrl = "";

    await loadBikes();

  }


  catch(error){

    console.error(error);

    alert(
      "Save error: " +
      error.message
    );

  }


  finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
    "💾 Save Bike";

  }

});


// LOAD BIKES
async function loadBikes(){
  const list=document.getElementById("bikeList");
  list.innerHTML="Loading...";

  const {data,error}=await db.from("bikes").select("*").order("id",{ascending:false});

  if(error){
    list.innerHTML="<p>❌ "+error.message+"</p>";
    return;
  }

  if(!data || !data.length){
    list.innerHTML='<p class="muted">Abhi koi bike available nahi hai.</p>';
    return;
  }

  list.innerHTML="";
  window.__bikePhotos={};

  data.forEach(function(bike){
    const div=document.createElement("div");
    div.className="bike";

    const name=bike.name||bike.model||bike.title||"Bike";
    const photos=[
      bike.image_url,bike.image_url_2,bike.image_url_3,
      bike.image_url_4,bike.image_url_5
    ].filter(Boolean);

    const galleryId="gallery-"+bike.id;
    window.__bikePhotos[galleryId]=photos;

    div.innerHTML=`
      ${photos.length ? `
        <div class="gallery" id="${galleryId}" data-index="0">
          <img class="gallery-img" src="${photos[0]}" alt="${name}">
          ${photos.length>1 ? `
            <button type="button" class="gallery-prev" onclick="changePhoto('${galleryId}',-1)">‹</button>
            <button type="button" class="gallery-next" onclick="changePhoto('${galleryId}',1)">›</button>
            <div class="gallery-count">1 / ${photos.length}</div>
          `:""}
        </div>`:""}

      <h3>${name}</h3>
      ${bike.price!=null ? `<div class="price">₹${bike.price}</div>`:""}
      ${bike.model ? `<span class="tag">Model: ${bike.model}</span>`:""}
      ${bike.year!=null ? `<span class="tag">Year: ${bike.year}</span>`:""}
      ${bike.km!=null ? `<span class="tag">KM: ${bike.km}</span>`:""}
      <br>
      <button type="button" class="edit" onclick="editBike('${bike.id}')">✏️ Edit</button>
      <button type="button" class="danger" onclick="deleteBike('${bike.id}')">🗑️ Delete</button>
    `;

    list.appendChild(div);
  });
}

function changePhoto(galleryId,direction){
  const photos=(window.__bikePhotos||{})[galleryId];
  const gallery=document.getElementById(galleryId);
  if(!photos || !gallery || photos.length<2) return;

  let index=Number(gallery.dataset.index||0);
  index=(index+direction+photos.length)%photos.length;
  gallery.dataset.index=index;

  gallery.querySelector(".gallery-img").src=photos[index];

  const count=gallery.querySelector(".gallery-count");
  if(count) count.textContent=(index+1)+" / "+photos.length;
}

// EDIT
async function editBike(id){
  const {data,error}=await db.from("bikes").select("*").eq("id",id).single();

  if(error){
    alert("Bike load error: "+error.message);
    return;
  }

  editingId=id;
  currentImageUrls=[
    data.image_url||"",
    data.image_url_2||"",
    data.image_url_3||"",
    data.image_url_4||"",
    data.image_url_5||""
  ];
  currentImageUrl=currentImageUrls[0]||"";

  document.getElementById("name").value=data.name||"";
  document.getElementById("model").value=data.model||"";
  document.getElementById("price").value=data.price??"";
  document.getElementById("year").value=data.year??"";
  document.getElementById("km").value=data.km??"";

  for(let i=1;i<=5;i++) document.getElementById("photo"+i).value="";

  const box=document.getElementById("photoPreviews");
  box.innerHTML="";
  currentImageUrls.forEach(function(url,index){
    if(url){
      const img=document.createElement("img");
      img.src=url;
      img.alt="Photo "+(index+1);
      img.style.cssText="width:140px;height:100px;object-fit:cover;border-radius:10px;margin:5px;";
      box.appendChild(img);
    }
  });

  document.getElementById("formTitle").textContent="✏️ Edit Bike";
  formPanel.classList.remove("hidden");
  window.scrollTo({top:formPanel.offsetTop,behavior:"smooth"});
}

// DELETE
async function deleteBike(id){

  const ok =
  confirm(
    "Kya aap ye bike delete karna chahte ho?"
  );

  if(!ok) return;


  const {error} =
  await db
    .from("bikes")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Delete error: " +
      error.message
    );

    return;
  }


  statusBox.textContent =
  "🗑️ Bike deleted successfully.";

  loadBikes();

}


// CLEAR FORM
function clearForm(){

  document.getElementById("name").value = "";

  document.getElementById("model").value = "";

  document.getElementById("price").value = "";

  document.getElementById("year").value = "";

  document.getElementById("km").value = "";

  document.getElementById("photo1").value = "";

  document.getElementById("photoPreviews").src = "";

  document.getElementById("photoPreviews")
    .classList.add("hidden");

}


// REFRESH
document.getElementById("refreshBtn")
.addEventListener("click", function(){

  loadBikes();

});


// CHECK SESSION
async function checkSession(){

  const {data} =
  await db.auth.getSession();

  if(data.session){
    await checkAdmin();
  }

}


checkSession();

</script>

</body>
</html>
