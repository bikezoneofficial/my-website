<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bike Zone Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:25px 16px 60px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

h1,h2,h3{
  margin-top:0;
}

input,
textarea{
  width:100%;
  padding:15px;
  margin:7px 0;
  background:#000;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  border:1px solid #fff;
  background:#fff;
  color:#000;
  padding:13px 20px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

button:hover{
  background:#000;
  color:#fff;
}

.logout{
  background:#000;
  color:#fff;
}

.logout:hover{
  background:#fff;
  color:#000;
}

.delete{
  background:#000;
  color:#fff;
  border-color:#555;
}

.delete:hover{
  background:#fff;
  color:#000;
}

.hidden{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.logo{
  font-size:30px;
  font-weight:bold;
  letter-spacing:1px;
}

.subtitle{
  color:#aaa;
}

.message{
  display:none;
  padding:12px;
  border:1px solid #555;
  border-radius:10px;
  margin-top:12px;
}

.bike{
  background:#080808;
  border:1px solid #333;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
}

.bike img{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  margin-bottom:15px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin:8px 0;
}

.small{
  color:#999;
  font-size:14px;
}

hr{
  border:0;
  border-top:1px solid #292929;
  margin:20px 0;
}

#loginBox{
  max-width:500px;
  margin:70px auto;
}

.login-title{
  font-size:32px;
  margin-bottom:8px;
}

.admin-title{
  font-size:28px;
}

.empty{
  color:#999;
  text-align:center;
  padding:25px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">

  <div class="login-title">
    🔒 Bike Zone
  </div>

  <p class="subtitle">
    Private Admin Login
  </p>

  <hr>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

  <div class="card">

    <div class="top">

      <div>
        <div class="admin-title">
          BIKE ZONE ADMIN
        </div>

        <div
          id="userEmail"
          class="small">
        </div>
      </div>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>


  <!-- ADD BIKE -->
  <div class="card">

    <h2 id="formTitle">
      Add New Bike
    </h2>

    <input
      id="bikeName"
      placeholder="Bike Name"
    >

    <input
      id="brand"
      placeholder="Brand"
    >

    <input
      id="model"
      placeholder="Model"
    >

    <input
      id="price"
      type="number"
      placeholder="Price"
    >

    <textarea
      id="description"
      placeholder="Bike Description">
    </textarea>

    <input
      id="imageUrl"
      placeholder="Bike Image URL"
    >

    <br>

    <button onclick="saveBike()">
      SAVE BIKE
    </button>

    <button
      class="logout"
      onclick="clearForm()">
      CLEAR
    </button>

    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- BIKES -->
  <div class="card">

    <div class="top">

      <h2>
        Your Bikes
      </h2>

      <button
        class="logout"
        onclick="loadBikes()">
        Refresh
      </button>

    </div>

    <div id="bikeList">
      Loading...
    </div>

  </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================
   VARIABLES
========================= */

let editingId = null;


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email || !password){

    showLoginMessage(
      "Email aur password bharo."
    );

    return;
  }


  const {data,error} =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    showLoginMessage(
      "Login failed: " + error.message
    );

    return;
  }


  await checkAdmin();
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  const {
    data:{user}
  } =
    await supabaseClient.auth
      .getUser();


  if(!user){

    showLogin();

    return;
  }


  const {data,error} =
    await supabaseClient
      .from("admin_users")
      .select("id")
      .eq("user_id",user.id)
      .maybeSingle();


  if(error || !data){

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "Access denied. Admin account required."
    );

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  document
    .getElementById("userEmail")
    .textContent =
      user.email;


  loadBikes();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  editingId = null;

  clearForm();

  showLogin();
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("adminPanel")
    .classList.add("hidden");
}


/* =========================
   LOAD BIKES
========================= */

async function loadBikes(){

  const list =
    document.getElementById("bikeList");

  list.innerHTML =
    "Loading...";


  const {data,error} =
    await supabaseClient
      .from("bikes")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    list.innerHTML =
      "<div class='empty'>Unable to load bikes.</div>";

    console.error(error);

    return;
  }


  if(!data || data.length === 0){

    list.innerHTML =
      "<div class='empty'>No bikes added yet.</div>";

    return;
  }


  list.innerHTML = "";


  data.forEach(bike => {

    const div =
      document.createElement("div");

    div.className =
      "bike";


    let image = "";

    if(bike.image_url){

      image = `
        <img
          src="${escapeHtml(bike.image_url)}"
          alt="Bike">
      `;
    }


    div.innerHTML = `

      ${image}

      <h3>
        ${escapeHtml(
          bike.name || "Bike"
        )}
      </h3>

      <div class="small">
        ${escapeHtml(
          bike.brand || ""
        )}
        ${bike.model
          ? " • " +
            escapeHtml(bike.model)
          : ""}
      </div>

      <div class="price">
        ₹${Number(
          bike.price || 0
        ).toLocaleString("en-IN")}
      </div>

      <p>
        ${escapeHtml(
          bike.description || ""
        )}
      </p>

      <button
        onclick='editBike(${JSON.stringify(bike)})'>
        EDIT
      </button>

      <button
        class="delete"
        onclick="deleteBike('${bike.id}')">
        DELETE
      </button>

    `;


    list.appendChild(div);

  });

}


/* =========================
   SAVE BIKE
========================= */

async function saveBike(){

  const name =
    document
      .getElementById("bikeName")
      .value
      .trim();

  const brand =
    document
      .getElementById("brand")
      .value
      .trim();

  const model =
    document
      .getElementById("model")
      .value
      .trim();

  const price =
    document
      .getElementById("price")
      .value;

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const image_url =
    document
      .getElementById("imageUrl")
      .value
      .trim();


  if(!name || !price){

    showMessage(
      "Bike name aur price required hai."
    );

    return;
  }


  const bikeData = {

    name:name,

    brand:brand,

    model:model,

    price:Number(price),

    description:description,

    image_url:image_url

  };


  let result;


  if(editingId){

    result =
      await supabaseClient
        .from("bikes")
        .update(bikeData)
        .eq("id",editingId);

  }else{

    result =
      await supabaseClient
        .from("bikes")
        .insert(bikeData);

  }


  if(result.error){

    console.error(result.error);

    showMessage(
      result.error.message
    );

    return;
  }


  showMessage(
    editingId
      ? "Bike updated successfully."
      : "Bike added successfully."
  );


  clearForm();

  loadBikes();
}


/* =========================
   EDIT BIKE
========================= */

function editBike(bike){

  editingId =
    bike.id;


  document
    .getElementById("formTitle")
    .textContent =
      "Edit Bike";


  document
    .getElementById("bikeName")
    .value =
      bike.name || "";


  document
    .getElementById("brand")
    .value =
      bike.brand || "";


  document
    .getElementById("model")
    .value =
      bike.model || "";


  document
    .getElementById("price")
    .value =
      bike.price || "";


  document
    .getElementById("description")
    .value =
      bike.description || "";


  document
    .getElementById("imageUrl")
    .value =
      bike.image_url || "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   DELETE
========================= */

async function deleteBike(id){

  const ok =
    confirm(
      "Delete this bike?"
    );


  if(!ok) return;


  const {error} =
    await supabaseClient
      .from("bikes")
      .delete()
      .eq("id",id);


  if(error){

    showMessage(
      error.message
    );

    return;
  }


  showMessage(
    "Bike deleted."
  );


  loadBikes();
}


/* =========================
   CLEAR
========================= */

function clearForm(){

  editingId = null;


  document
    .getElementById("formTitle")
    .textContent =
      "Add New Bike";


  document
    .getElementById("bikeName")
    .value = "";


  document
    .getElementById("brand")
    .value = "";


  document
    .getElementById("model")
    .value = "";


  document
    .getElementById("price")
    .value = "";


  document
    .getElementById("description")
    .value = "";


  document
    .getElementById("imageUrl")
    .value = "";
}


/* =========================
   MESSAGES
========================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.style.display =
    "block";


  setTimeout(()=>{
    box.style.display =
      "none";
  },4000);
}


function showLoginMessage(text){

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent =
    text;

  box.style.display =
    "block";
}


/* =========================
   SECURITY DISPLAY
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   SESSION CHECK
========================= */

supabaseClient.auth
.onAuthStateChange(
  async (event,session)=>{

    if(session){

      await checkAdmin();

    }

  }
);


checkAdmin();

</script>

</body>
</html>list.innerHTML
