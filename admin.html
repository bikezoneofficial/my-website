<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bike Zone Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px 15px 60px;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #444;
      background: #050505;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      padding: 13px 18px;
      margin: 6px 4px 6px 0;
      border-radius: 10px;
      border: 1px solid white;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: black;
      color: white;
    }

    .danger {
      background: #000;
      color: white;
      border-color: #555;
    }

    .danger:hover {
      background: white;
      color: black;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .muted {
      color: #999;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #555;
      border-radius: 10px;
    }

    .bike {
      background: #080808;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
    }

    .bike img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 10px;
    }

    #loginBox {
      max-width: 500px;
      margin: 70px auto;
    }

    .loginTitle {
      font-size: 32px;
      font-weight: bold;
    }

    .adminTitle {
      font-size: 27px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ================= LOGIN ================= -->

  <div id="loginBox" class="card">

    <div class="loginTitle">
      🔒 Bike Zone
    </div>

    <p class="muted">
      Private Admin Login
    </p>

    <hr>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ================= ADMIN PANEL ================= -->

  <div id="adminPanel" class="hidden">

    <!-- HEADER -->

    <div class="card">

      <div class="top">

        <div>
          <div class="adminTitle">
            🚲 BIKE ZONE ADMIN
          </div>

          <div
            id="userEmail"
            class="muted">
          </div>
        </div>

        <button
          class="danger"
          onclick="logout()">
          LOGOUT
        </button>

      </div>

    </div>


    <!-- ADD / EDIT BIKE -->

    <div class="card">

      <h2 id="formTitle">
        Add New Bike
      </h2>

      <input
        id="bikeName"
        placeholder="Bike Name"
      >

      <input
        id="brand"
        placeholder="Brand"
      >

      <input
        id="model"
        placeholder="Model"
      >

      <input
        id="price"
        type="number"
        placeholder="Price"
      >

      <textarea
        id="description"
        placeholder="Bike Description"></textarea>

      <input
        id="imageUrl"
        type="url"
        placeholder="Bike Image URL"
      >

      <button onclick="saveBike()">
        SAVE BIKE
      </button>

      <button
        class="danger"
        onclick="clearForm()">
        CLEAR
      </button>

      <div
        id="message"
        class="message">
      </div>

    </div>


    <!-- BIKE LIST -->

    <div class="card">

      <div class="top">

        <h2>
          Your Bikes
        </h2>

        <button
          class="danger"
          onclick="loadBikes()">
          REFRESH
        </button>

      </div>

      <div id="bikeList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   =====================================================

   YAHAN APNI SUPABASE VALUES DALO.

   Example:

   const SUPABASE_URL =
   "https://xxxxxxxx.supabase.co";

   const SUPABASE_ANON_KEY =
   "eyJhbGciOiJIUzI1NiIs...";

   IMPORTANT:
   Service role / secret key yahan MAT dalna.
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let editingId = null;


/* =====================================================
   HELPER
===================================================== */

function $(id) {
  return document.getElementById(id);
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if (!email || !password) {

    showLoginMessage(
      "Email aur password bharo."
    );

    return;
  }

  showLoginMessage(
    "Login ho raha hai..."
  );


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    console.error(error);

    showLoginMessage(
      "Login failed: " + error.message
    );

    return;
  }


  if (!data || !data.user) {

    showLoginMessage(
      "User login nahi hua."
    );

    return;
  }


  await checkAdmin();
}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    showLogin();

    return;
  }


  /*
    Check admin_users table
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "Admin check error:",
      error
    );

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "Admin table check failed. Supabase setup check karo."
    );

    return;
  }


  if (!data) {

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "Access denied. Ye account admin nahi hai."
    );

    return;
  }


  /* ADMIN SUCCESS */

  $("loginBox")
    .classList
    .add("hidden");


  $("adminPanel")
    .classList
    .remove("hidden");


  $("userEmail")
    .textContent =
      user.email || "";


  await loadBikes();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  editingId = null;

  clearForm();

  showLogin();
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

  $("loginBox")
    .classList
    .remove("hidden");


  $("adminPanel")
    .classList
    .add("hidden");


  $("email").value = "";

  $("password").value = "";
}


/* =====================================================
   LOAD BIKES
===================================================== */

async function loadBikes() {

  const list =
    $("bikeList");


  list.innerHTML =
    "<div class='empty'>Loading bikes...</div>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bikes")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    list.innerHTML =
      "<div class='empty'>" +
      "Bikes load nahi ho rahi: " +
      escapeHtml(error.message) +
      "</div>";

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML =
      "<div class='empty'>" +
      "Abhi koi bike add nahi hai." +
      "</div>";

    return;
  }


  list.innerHTML = "";


  data.forEach(function(bike) {

    const div =
      document.createElement("div");

    div.className =
      "bike";


    let html = "";


    if (bike.image_url) {

      html +=
        "<img src=\"" +
        escapeAttribute(
          bike.image_url
        ) +
        "\" alt=\"Bike\">";
    }


    html +=
      "<h3>" +
      escapeHtml(
        bike.name || "Bike"
      ) +
      "</h3>";


    html +=
      "<div class='muted'>" +
      escapeHtml(
        bike.brand || ""
      );


    if (bike.model) {

      html +=
        " • " +
        escapeHtml(
          bike.model
        );
    }


    html +=
      "</div>";


    html +=
      "<div class='price'>" +
      "₹" +
      Number(
        bike.price || 0
      ).toLocaleString("en-IN") +
      "</div>";


    html +=
      "<p>" +
      escapeHtml(
        bike.description || ""
      ) +
      "</p>";


    html +=
      "<button " +
      "onclick='editBikeById(\"" +
      escapeAttribute(
        bike.id
      ) +
      "\")'>" +
      "EDIT" +
      "</button>";


    html +=
      "<button " +
      "class='danger' " +
      "onclick='deleteBike(\"" +
      escapeAttribute(
        bike.id
      ) +
      "\")'>" +
      "DELETE" +
      "</button>";


    div.innerHTML =
      html;


    list.appendChild(div);

  });

}


/* =====================================================
   GET ONE BIKE FOR EDIT
===================================================== */

async function editBikeById(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("bikes")
      .select("*")
      .eq("id", id)
      .maybeSingle();


  if (error || !data) {

    showMessage(
      "Bike nahi mili."
    );

    return;
  }


  editingId =
    data.id;


  $("formTitle")
    .textContent =
      "Edit Bike";


  $("bikeName").value =
    data.name || "";


  $("brand").value =
    data.brand || "";


  $("model").value =
    data.model || "";


  $("price").value =
    data.price || "";


  $("description").value =
    data.description || "";


  $("imageUrl").value =
    data.image_url || "";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================================
   SAVE BIKE
===================================================== */

async function saveBike() {

  const name =
    $("bikeName")
      .value
      .trim();


  const brand =
    $("brand")
      .value
      .trim();


  const model =
    $("model")
      .value
      .trim();


  const price =
    $("price")
      .value;


  const description =
    $("description")
      .value
      .trim();


  const image_url =
    $("imageUrl")
      .value
      .trim();


  if (!name) {

    showMessage(
      "Bike name required hai."
    );

    return;
  }


  if (!price) {

    showMessage(
      "Price required hai."
    );

    return;
  }


  const bikeData = {

    name: name,

    brand: brand,

    model: model,

    price: Number(price),

    description: description,

    image_url: image_url

  };


  let result;


  /* EDIT */

  if (editingId) {

    result =
      await supabaseClient
        .from("bikes")
        .update(bikeData)
        .eq("id", editingId);

  }

  /* ADD */

  else {

    result =
      await supabaseClient
        .from("bikes")
        .insert(bikeData);

  }


  if (result.error) {

    console.error(
      result.error
    );

    showMessage(
      result.error.message
    );

    return;
  }


  showMessage(
    editingId
      ? "Bike successfully updated."
      : "Bike successfully added."
  );


  clearForm();

  await loadBikes();
}


/* =====================================================
   DELETE BIKE
===================================================== */

async function deleteBike(id) {

  const confirmDelete =
    window.confirm(
      "Kya tum ye bike delete karna chahte ho?"
    );


  if (!confirmDelete) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bikes")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    showMessage(
      error.message
    );

    return;
  }


  showMessage(
    "Bike delete ho gayi."
  );


  await loadBikes();
}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  editingId = null;


  $("formTitle")
    .textContent =
      "Add New Bike";


  $("bikeName").value = "";

  $("brand").value = "";

  $("model").value = "";

  $("price").value = "";

  $("description").value = "";

  $("imageUrl").value = "";
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

  const box =
    $("message");


  box.textContent =
    text;


  box.style.display =
    "block";


  setTimeout(
    function() {

      box.style.display =
        "none";

    },
    4000
  );
}


function showLoginMessage(text) {

  const box =
    $("loginMessage");


  box.textContent =
    text;


  box.style.display =
    "block";
}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      "\"",
      "&quot;"
    )

    .replaceAll
