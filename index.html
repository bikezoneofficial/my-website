<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jwvuyvqejoweyyhexonh.supabase.co";
const SUPABASE_KEY="sb_publishable_9xr4-mJuetYNknBqMVvcYA_7OzE6CDm";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const SETTINGS={
  phone:"8878051833",
  waGroup:"https://chat.whatsapp.com/D3imghlgY9CIcJSDmlt5i6?s=cl&p=a&ilr=4",
  instagram:"https://ig.me/j/AbY_sSpxRI66eGM3/"
};

document.getElementById("phone").textContent=SETTINGS.phone;
document.getElementById("waGroup").href=SETTINGS.waGroup;
document.getElementById("ig").href=SETTINGS.instagram;
document.getElementById("wa").href="https://wa.me/91"+SETTINGS.phone;

async function loadBikes(){
  const list=document.getElementById("list");

  const {data,error}=await db
    .from("bikes")
    .select("*");

  if(error){
    console.error(error);
    list.innerHTML='<div class="empty">Bikes load nahi ho pa rahe.</div>';
    return;
  }

  if(!data || data.length===0){
    list.innerHTML='<div class="empty">Abhi koi bike available nahi hai.</div>';
    return;
  }

  list.innerHTML=data.map(bike=>{
    const name=bike.name || bike.model || bike.title || "Bike";
    const price=bike.price ? "₹"+bike.price : "";
    const year=bike.year ? "Year: "+bike.year : "";
    const km=bike.km ? "KM: "+bike.km : "";
    const image=bike.image_url || "";

    return `
      <article class="card">
        ${image ? `<img src="${image}" alt="${name}">` : ""}
        <div class="pad">
          <h3>${name}</h3>
          ${price ? `<div class="price">${price}</div>` : ""}
          ${year ? `<span class="tag">${year}</span>` : ""}
          ${km ? `<span class="tag">${km}</span>` : ""}
        </div>
      </article>
    `;
  }).join("");
}

loadBikes();
</script>
